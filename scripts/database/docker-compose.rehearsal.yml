services:
  disposable-pg:
    image: postgres:16-alpine
    container_name: masterhrms_disposable_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: masterhrms_rehearsal
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masterhrms_rehearsal"]
      interval: 2s
      timeout: 3s
      retries: 10
