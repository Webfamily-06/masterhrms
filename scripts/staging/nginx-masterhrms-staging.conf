# MASTERHRMS — STAGING NGINX REVERSE PROXY & TLS CONFIGURATION
# Location: /etc/nginx/sites-available/masterhrms-staging.conf

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=staging_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=staging_auth_limit:10m rate=5r/s;

# Upstream Backend (Express API)
upstream masterhrms_backend {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend (Next.js CMS Server)
upstream masterhrms_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP (Port 80) -> Redirect All Traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name staging.masterhrms.com *.staging.masterhrms.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (Port 443) -> Staging Apex & Wildcard Subdomains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.masterhrms.com *.staging.masterhrms.com;

    # SSL Certificates (Issued via Certbot DNS-01 Challenge)
    ssl_certificate /etc/letsencrypt/live/staging.masterhrms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.masterhrms.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Static Assets Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        proxy_pass http://masterhrms_frontend;
    }

    # Authentication Route Rate Limiting
    location /api/auth/ {
        limit_req zone=staging_auth_limit burst=10 nodelay;
        proxy_pass http://masterhrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API Proxy Routing
    location /api/ {
        limit_req zone=staging_api_limit burst=30 nodelay;
        proxy_pass http://masterhrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts (prevent hung requests)
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health Check Proxy (Direct pass-through for monitoring probes)
    location /api/health {
        proxy_pass http://masterhrms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Frontend SSR Application Proxy
    location / {
        proxy_pass http://masterhrms_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
