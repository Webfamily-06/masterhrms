<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <linearGradient id="bg-blog-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="glow-blog-1" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-blog-1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="url(#bg-blog-1)" />
  <rect width="880" height="440" fill="url(#grid-blog-1)" />
  <rect width="880" height="440" fill="url(#glow-blog-1)" />

  <!-- Accent glow orb -->
  <circle cx="700" cy="220" r="180" fill="#10b981" opacity="0.12" filter="blur(40px)" />

  <!-- Geometric Illustration -->
  <circle cx="680" cy="220" r="140" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
           <circle cx="680" cy="220" r="90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
           <rect x="620" y="160" width="120" height="120" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
           <path d="M650 220h60M680 190v60M660 200l40 40M660 240l40-40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Content Group -->
  <g transform="translate(60, 80)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="200" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="1">GLOBAL PAYROLL &amp; TAX</text>

    <!-- Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">Automating Multi-Country Payroll...</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      <tspan x="0" dy="0">Cross-border statutory compliance and automated mu</tspan>
      <tspan x="0" dy="22">lti-currency pay runs</tspan>
    </text>

    <!-- Platform Brand Stamp -->
    <g transform="translate(0, 195)">
      <circle cx="10" cy="10" r="10" fill="#3b82f6"/>
      <path d="M6 10l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Master HRMS Editorial</text>
    </g>
  </g>
</svg>