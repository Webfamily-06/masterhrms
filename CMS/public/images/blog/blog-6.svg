<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <linearGradient id="bg-blog-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="glow-blog-6" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-blog-6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="url(#bg-blog-6)" />
  <rect width="880" height="440" fill="url(#grid-blog-6)" />
  <rect width="880" height="440" fill="url(#glow-blog-6)" />

  <!-- Accent glow orb -->
  <circle cx="700" cy="220" r="180" fill="#c084fc" opacity="0.12" filter="blur(40px)" />

  <!-- Geometric Illustration -->
  <rect x="610" y="150" width="140" height="140" rx="24" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
           <path d="M640 190h80M640 220h60M640 250h40" stroke="#e9d5ff" stroke-width="3.5" stroke-linecap="round"/>
           <polygon points="730,230 750,210 740,200 720,220" fill="#a855f7" stroke="#f3e8ff" stroke-width="1.5"/>

  <!-- Content Group -->
  <g transform="translate(60, 80)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="191.5" height="32" rx="16" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="1"/>
    <text x="15" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">CONTENT &amp; WORKFLOWS</text>

    <!-- Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      <tspan x="0" dy="0">The Future of AI Content Tools</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      <tspan x="0" dy="0">Connecting strategy, creation, and distribution wi</tspan>
      <tspan x="0" dy="22">th team guardrails built in</tspan>
    </text>

    <!-- Platform Brand Stamp -->
    <g transform="translate(0, 195)">
      <circle cx="10" cy="10" r="10" fill="#3b82f6"/>
      <path d="M6 10l3 3 5-6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Master HRMS Editorial</text>
    </g>
  </g>
</svg>